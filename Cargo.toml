[package]
name = "rustm"
version = "0.2.0"
edition = "2024"
description = "rustm - Blazing-fast Rust/Cargo build compiler & optimizer"
license = "MIT"
authors = ["rustm contributors"]
readme = "README.md"
keywords = ["cargo", "build", "compiler", "fast", "optimizer"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rustm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
which = "7"
colored = "3"
indicatif = "0.17"
chrono = "0.4"
dirs = "6"
sha2 = "0.10"
fs_extra = "1"
rayon = "1.10"

